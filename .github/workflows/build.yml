name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :pio:assembleDebug --stacktrace

      - name: Build release_mini APK (unsigned, minified)
        run: ./gradlew :pio:assembleRelease_mini --stacktrace

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Sign release_mini APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/28.0.3"
          UNSIGNED_APK=$(find pio/build/outputs/apk/release_mini -name "*.apk" | head -n1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" pio-release_mini-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out pio-release_mini-signed.apk \
            pio-release_mini-aligned.apk
          rm -f release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dna-debug-apk
          path: pio/build/outputs/apk/debug/*.apk

      - name: Upload release_mini APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: dna-release_mini-apk-unsigned
          path: pio/build/outputs/apk/release_mini/*.apk

      - name: Upload signed release_mini APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dna-release_mini-apk-signed
          path: pio-release_mini-signed.apk
