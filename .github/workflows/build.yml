name: Build APK

on:
  workflow_dispatch:
    inputs:
      dna_from_source:
        description: 'Compile dna from dna.c (replaces prebuilt inside APK)'
        type: boolean
        default: true
      superchunk_from_source:
        description: 'Build superchunk helpers from source (replaces prebuilts inside APK)'
        type: boolean
        default: true
      upload_to_telegram:
        description: 'Upload the built APK to Telegram'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.appversion.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read versionName from build.gradle
        id: appversion
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName[[:space:]]+"([^"]+)".*/\1/p' pio/build.gradle | head -n1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::versionName not found in pio/build.gradle"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Detected versionName: $VERSION_NAME"

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 8 (for Gradle/AGP build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Install required SDK components
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      - name: Install Android NDK
        if: ${{ inputs.dna_from_source || inputs.superchunk_from_source }}
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: sdkmanager "ndk;21.4.7075529"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :pio:assembleDebug -PdnaFromSource=${{ inputs.dna_from_source }} -PsuperchunkFromSource=${{ inputs.superchunk_from_source }} --stacktrace 2>&1 | tee debug_build.log

      - name: Build release_mini APK (unsigned, minified)
        run: |
          set -o pipefail
          ./gradlew :pio:assembleRelease_mini -PdnaFromSource=${{ inputs.dna_from_source }} -PsuperchunkFromSource=${{ inputs.superchunk_from_source }} --stacktrace 2>&1 | tee release_build.log

      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Sign release_mini APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/28.0.3"
          UNSIGNED_APK=$(find pio/build/outputs/apk/release_mini -name "*.apk" | head -n1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" pio-release_mini-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "DNA-BETA-${{ steps.appversion.outputs.version }}-signed.apk" \
            pio-release_mini-aligned.apk
          rm -f release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dna-debug-${{ steps.appversion.outputs.version }}-apk
          path: pio/build/outputs/apk/debug/*.apk

      - name: Upload release_mini APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: DNA-BETA-${{ steps.appversion.outputs.version }}-unsigned
          path: pio/build/outputs/apk/release_mini/*.apk

      - name: Upload signed release_mini APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DNA-BETA-${{ steps.appversion.outputs.version }}
          path: DNA-BETA-${{ steps.appversion.outputs.version }}-signed.apk

      - name: Collect full build logs
        if: always()
        shell: bash
        run: |
          mkdir -p logs
          [ -f debug_build.log ] && cp debug_build.log logs/
          [ -f release_build.log ] && cp release_build.log logs/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dna-build-logs
          path: logs/
          if-no-files-found: warn

  telegram:
    needs: build
    if: ${{ inputs.upload_to_telegram }}
    uses: ./.github/workflows/upload.yml
    with:
      artifact_pattern: 'DNA-*'
      caption_title: 'DNA ${{ needs.build.outputs.version }}'
    secrets: inherit
