name: Build APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up JDK 8 (for Gradle/AGP build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Install required SDK components
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :pio:assembleDebug --stacktrace

      - name: Build release_mini APK (unsigned, minified)
        run: ./gradlew :pio:assembleRelease_mini --stacktrace

      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Sign release_mini APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/28.0.3"
          UNSIGNED_APK=$(find pio/build/outputs/apk/release_mini -name "*.apk" | head -n1)
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" pio-release_mini-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out dna-release-2.2.0-EN-signed.apk \
            pio-release_mini-aligned.apk
          rm -f release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dna-debug-2.2.0-apk
          path: pio/build/outputs/apk/debug/*.apk

      - name: Upload release_mini APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: dna-release-2.2.0-EN-unsigned
          path: pio/build/outputs/apk/release_mini/*.apk

      - name: Upload signed release_mini APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dna-release-2.2.0-EN-signed
          path: dna-release-2.2.0-EN-signed.apk
