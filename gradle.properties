# android.useDeprecatedNdk=false
android.enableJetifier=true
android.useAndroidX=true
# Compile assets/tools/dna from dna.c during the APK build.
# The prebuilt binary stays in the repository but is replaced inside the APK.
# dnaFromSource=true
# Build merge_superchunk, seprate_superchunk and chunk_split from their sources.
# Prebuilt binaries stay in the repository but are replaced inside the APK.
# superchunkFromSource=true
# Stage patch_vbmeta from its shell source instead of the shc-compiled prebuilt.
# The prebuilt stays in the repository but is replaced inside the APK.
# patchVbmetaFromSource=false
# Replace the bundled f2fs helpers with clean universal builds inside the APK.
# The original assets stay in the repository.
# f2fsClean=true
