apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

def dnaFromSource = (project.findProperty("dnaFromSource") ?: "false").toString().toBoolean()
def superchunkFromSource = (project.findProperty("superchunkFromSource") ?: "false").toString().toBoolean()
def dnaAssetsDir = new File(buildDir, "generated/dnaAssets")
def dnaSourceFile = file("src/main/assets/tools/dna.c")
def superchunkSources = [
    merge_superchunk: file("src/main/assets/tools/merge_superchunk.sh"),
    seprate_superchunk: file("src/main/assets/tools/seprate_superchunk.sh"),
    chunk_split: file("src/main/assets/tools/chunk_split.c")
]

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.3'

    defaultConfig {
        resConfigs "zh"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 202111143
        versionName "2.9.0-EN"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        release_mini {
            shrinkResources true
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Package a staged copy of the assets instead of src/main/assets directly.
    // This lets the build replace the prebuilt dna binary and drop dna.c from the APK.
    sourceSets {
        main {
            assets.srcDirs = [dnaAssetsDir]
        }
    }
}

def readLocalProperties = {
    def props = new Properties()
    def f = rootProject.file("local.properties")
    if (f.exists()) {
        f.withInputStream { props.load(it) }
    }
    props
}

def findNdk = {
    def explicit = project.findProperty("dnaNdk")
    if (explicit) return file(explicit)
    def fromEnv = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
    if (fromEnv) return file(fromEnv)
    def props = readLocalProperties()
    if (props.getProperty("ndk.dir")) return file(props.getProperty("ndk.dir"))
    def sdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: props.getProperty("sdk.dir")
    if (sdk) {
        def ndkRoot = new File(sdk, "ndk")
        def dirs = ndkRoot.listFiles()?.findAll { it.isDirectory() }
        if (dirs) return dirs.sort { it.name }.last()
    }
    null
}

def findDnaCompiler = {
    def explicit = project.findProperty("dnaCc")
    if (explicit) return file(explicit)
    def names = ["aarch64-linux-android21-clang", "aarch64-linux-android23-clang", "aarch64-linux-android-clang"]
    def ndk = findNdk()
    if (ndk != null) {
        def os = System.getProperty("os.name").toLowerCase()
        def hosts = os.contains("windows") ? ["windows-x86_64"] : (os.contains("mac") ? ["darwin-x86_64", "darwin-aarch64"] : ["linux-x86_64", "linux-aarch64"])
        for (host in hosts) {
            def bin = new File(ndk, "toolchains/llvm/prebuilt/${host}/bin")
            for (name in names) {
                def c = new File(bin, name)
                if (c.isFile()) return c
            }
            def found = bin.listFiles()?.find { it.isFile() && it.name ==~ /aarch64-linux-android\d+-clang/ }
            if (found) return found
        }
    }
    for (dir in (System.getenv("PATH") ?: "").split(File.pathSeparator)) {
        for (name in names) {
            def c = new File(dir, name)
            if (c.isFile() && c.canExecute()) return c
        }
    }
    null
}

task prepareDnaAssets {
    group = "build"
    description = "Stages assets and optionally builds dna and superchunk helpers from source"
    def localAssets = file("src/main/assets")
    inputs.dir(localAssets)
    inputs.file(dnaSourceFile)
    superchunkSources.each { name, source -> inputs.file(source) }
    inputs.property("dnaFromSource", dnaFromSource)
    inputs.property("superchunkFromSource", superchunkFromSource)
    inputs.property("dnaCc", project.findProperty("dnaCc") ?: "")
    inputs.property("dnaNdk", project.findProperty("dnaNdk") ?: "")
    outputs.dir(dnaAssetsDir)

    doLast {
        delete dnaAssetsDir
        copy {
            from(localAssets)
            into(dnaAssetsDir)
            exclude("tools/dna.c")
            exclude("tools/merge_superchunk.sh")
            exclude("tools/seprate_superchunk.sh")
            exclude("tools/chunk_split.c")
        }

        def compiler = null
        if (dnaFromSource || superchunkFromSource) {
            compiler = findDnaCompiler()
            if (compiler == null) {
                throw new GradleException("Source build requested, but no Android NDK compiler was found. Install the NDK or pass -PdnaCc=/path/to/aarch64-linux-android21-clang")
            }
        }

        def stagedBinary = new File(dnaAssetsDir, "tools/dna")
        if (dnaFromSource) {
            delete stagedBinary
            stagedBinary.parentFile.mkdirs()
            exec {
                commandLine compiler.absolutePath, "-O2", "-Wall", "-Wextra", "-fPIE", "-pie", "-o", stagedBinary.absolutePath, dnaSourceFile.absolutePath
            }
            if (!stagedBinary.isFile()) {
                throw new GradleException("dna compilation did not produce ${stagedBinary}")
            }
            stagedBinary.setExecutable(true, false)
            logger.lifecycle("dna: built ${stagedBinary} from ${dnaSourceFile.name}")
        } else {
            logger.lifecycle("dna: using prebuilt ${stagedBinary}")
        }

        def toolsDir = new File(dnaAssetsDir, "tools")
        def stagedMerge = new File(toolsDir, "merge_superchunk")
        def stagedSeprate = new File(toolsDir, "seprate_superchunk")
        def stagedChunkSplit = new File(toolsDir, "chunk_split")
        if (superchunkFromSource) {
            delete stagedMerge, stagedSeprate, stagedChunkSplit
            toolsDir.mkdirs()
            exec {
                commandLine compiler.absolutePath, "-O2", "-Wall", "-Wextra", "-fPIE", "-pie", "-o", stagedChunkSplit.absolutePath, superchunkSources.chunk_split.absolutePath
            }
            if (!stagedChunkSplit.isFile()) {
                throw new GradleException("chunk_split compilation did not produce ${stagedChunkSplit}")
            }
            stagedChunkSplit.setExecutable(true, false)
            copy {
                from(superchunkSources.merge_superchunk)
                into(toolsDir)
                rename { "merge_superchunk" }
            }
            copy {
                from(superchunkSources.seprate_superchunk)
                into(toolsDir)
                rename { "seprate_superchunk" }
            }
            stagedMerge.setExecutable(true, false)
            stagedSeprate.setExecutable(true, false)
            logger.lifecycle("superchunk: built merge_superchunk, seprate_superchunk and chunk_split from source")
        } else {
            logger.lifecycle("superchunk: using prebuilt merge_superchunk, seprate_superchunk and chunk_split")
        }
    }
}

afterEvaluate {
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.all { task ->
        task.dependsOn prepareDnaAssets
    }
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.9"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation project(':common') // 添加依赖模块
    implementation project(':krscript') // 添加依赖模块
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'com.github.L-JINBIN:MTDataFilesProvider:v1.0.0'
}
repositories {
    mavenCentral()
}
